repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: no-underscore-names
        name: no underscore-prefixed names
        entry: pytest -q tests/test_style.py
        language: system
        pass_filenames: false
        types: [python]
