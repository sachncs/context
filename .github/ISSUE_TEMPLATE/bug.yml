name: Bug report
description: Report a bug in Foveate
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: When I run X with Y, Z happens instead of W.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Step one
        2. Step two
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Python version:
        - foveate version (`python -c "import foveate; print(foveate.__version__)"`):
        - Model / backend (e.g. gpt-oss-20b via OpenAI-compatible, LiteLLM, vLLM):
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
