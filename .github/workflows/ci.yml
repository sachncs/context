name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tokenize]"
      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: Type check
        run: mypy
      - name: Unit tests (includes the no-underscore naming gate)
        run: pytest -m "not integration" --cov --cov-report=term-missing

  integration:
    name: real-model and framework tests
    runs-on: ubuntu-latest
    needs: test
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for provider key
        id: key
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "No NVIDIA_API_KEY secret; skipping real-model tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install with agent frameworks
        if: steps.key.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tokenize,openai,frameworks]"
      - name: Integration tests (real model; Pydantic AI, ADK, LangGraph)
        if: steps.key.outputs.run == 'true'
        run: pytest tests/integration -p no:cacheprovider -W ignore

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Wheel ships resources
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for name in ("finer", "formula", "ddxplus"):
              assert f"ceng/bench/fixtures/{name}.jsonl" in names, name
              assert f"ceng/bench/seeds/{name}.md" in names, name
          assert "ceng/py.typed" in names
          PY
      - name: Install outside the checkout and smoke test
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I -c "import ceng, importlib.metadata as m; assert ceng.__version__ == m.version('ceng-context')"
          "$RUNNER_TEMP/venv/bin/python" -I -c "from ceng.bench import Formula; assert len(Formula().seed_playbook()) > 0 and len(Formula().load_samples()) == 20"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: npm ci && npm run build
