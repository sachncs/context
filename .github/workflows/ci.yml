name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tokenize]"
      - name: Lint
        run: |
          ruff check foveate tests examples
          ruff format --check foveate tests examples
      - name: Type check
        run: mypy
      - name: Unit tests (includes the no-underscore naming gate)
        run: pytest -m "not integration" --cov --cov-report=term-missing

  frameworks:
    name: framework adapters (no model)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with agent frameworks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tokenize,frameworks]"
      - name: Adapter tests against the real framework message classes
        run: >
          pytest tests/test_framework_adapters.py tests/test_agent_tools.py
          -p no:cacheprovider -W ignore
          --cov=foveate/integrations --cov-config=/dev/null
          --cov-report=term-missing --cov-fail-under=85

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Wheel ships resources
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for name in ("finer", "formula", "ddxplus"):
              assert f"foveate/bench/fixtures/{name}.jsonl" in names, name
              assert f"foveate/bench/seeds/{name}.md" in names, name
          assert "foveate/py.typed" in names
          assert any(n.startswith("foveate/bench/longdoc/gold/") for n in names)
          stray = [n for n in names if not n.split("/")[0] in ("foveate",) and ".dist-info" not in n.split("/")[0]]
          assert not stray, stray
          PY
      - name: Install outside the checkout and smoke test
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I -c "import foveate, importlib.metadata as m; assert foveate.__version__ == m.version('foveate')"
          "$RUNNER_TEMP/venv/bin/python" -I -c "from foveate.bench import Formula; assert len(Formula().seed_playbook()) > 0 and len(Formula().load_samples()) == 20"
          "$RUNNER_TEMP/venv/bin/python" -I -c "from foveate import Document, Foveator, Runtime; d = Document.load(b'a b c. ' * 400, format='text', doc_id='x'); p = Foveator(Runtime.without_llm(), budget=1000).plan('a?', [d]); assert p.document_tokens > 0"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: npm ci && npm run build
