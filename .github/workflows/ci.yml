name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tokenize]"
          pip install coverage build twine ruff mypy
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src/ceng
      - name: Tests
        run: coverage run -m pytest -q
      - name: Coverage
        if: matrix.python-version == '3.12'
        run: coverage report
      - name: Build and validate artifacts
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          twine check dist/*

  package-install:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel outside checkout
        run: |
          python -m venv /tmp/ceng-install-check
          /tmp/ceng-install-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ceng-install-check/bin/python -c "import ceng; assert ceng.__version__ == '1.0.0'"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: npm ci && npm run build
