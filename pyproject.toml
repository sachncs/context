[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceng"
version = "1.0.0"
description = "Partition-Prompt-Aggregate context engineering for LLMs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sachin" }]
maintainers = [{ name = "Sachin", email = "sachncs@gmail.com" }]
keywords = ["llm", "context-engineering", "compression", "vllm", "litellm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.5"]
openai = ["openai>=1.0"]
tokenize = ["tiktoken>=0.5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "coverage>=7",
    "build>=1",
    "twine>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
all = ["vllm>=0.5", "openai>=1.0", "tiktoken>=0.5"]

[project.scripts]
ceng-bench = "ceng.bench:main"

[project.urls]
Homepage = "https://github.com/sachncs/context"
Issues = "https://github.com/sachncs/context/issues"
Documentation = "https://sachncs.github.io/context"
Changelog = "https://github.com/sachncs/context/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceng = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["ceng"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["bench", ".ceng"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",  # line length is governed by [tool.ruff] line-length
    "B008",  # default-argument calls in dataclass fields are intentional
    "B905",  # zip() without strict= is fine for our use
    "E741",  # ambiguous variable names like `l` are noise in this codebase
    "RUF012",  # mutable class attributes annotated with ClassVar are noisy
    "RUF022",  # __all__ is grouped by section for readability, not sorted
    "RUF043",  # pytest.raises(match=...) patterns are fine
    "RUF059",  # unpacked-but-unused in tests is intentional
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
