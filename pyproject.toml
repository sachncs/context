[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foveate"
version = "0.2.0"
description = "Context engineering for LLM apps: page selection, verified citations, compression and evaluation. No required dependencies."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sachin" }]
maintainers = [{ name = "Sachin", email = "sachncs@gmail.com" }]
keywords = ["llm", "context-engineering", "rag", "compression", "long-context", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
vllm = ["vllm>=0.29.0"]
tokenize = ["tiktoken>=0.5"]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pypdf>=4",
    "fpdf2>=2.7",
    "python-docx>=1",
    "opentelemetry-sdk>=1.25",
    "tomli>=2; python_version < '3.11'",
    "coverage>=7",
    "build>=1",
    "twine>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/sachncs/foveate"
Issues = "https://github.com/sachncs/foveate/issues"
Documentation = "https://sachncs.github.io/foveate"
Changelog = "https://github.com/sachncs/foveate/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["foveate*"]

[tool.setuptools.package-data]
foveate = ["py.typed", "bench/fixtures/*.jsonl", "bench/seeds/*.md", "bench/longdoc/gold/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["integration: calls a real LLM provider (needs NVIDIA_API_KEY)"]

[tool.coverage.run]
branch = true
source = ["foveate"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "D", "N", "ANN", "S", "SIM"]
ignore = [
    "D203", "D213",          # pick google-compatible blank-line rules
    "D102", "D105", "D107",  # overrides inherit the base-class docstring
    "ANN401",                # Any is policed by mypy --strict instead
    "RUF012",
    "B027",                  # optional hooks with no-op defaults are intended
    "S311",                  # random is used for retry jitter, not security
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN", "S311", "N818", "RUF059", "SIM117", "E501"]
"examples/**" = ["D", "ANN", "S101", "E501", "S105"]
"integrations/**" = ["D", "ANN", "S101", "E501", "N818", "SIM117"]
"foveate/evolution/prompts.py" = ["E501"]  # verbatim upstream prompt text

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["foveate"]

[[tool.mypy.overrides]]
module = [
    "vllm.*", "tiktoken.*", "yaml.*",
]
ignore_missing_imports = true
