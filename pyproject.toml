[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceng-context"
version = "2.0.0.dev0"
description = "Partition-Prompt-Aggregate context engineering for LLMs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sachin" }]
maintainers = [{ name = "Sachin", email = "sachncs@gmail.com" }]
keywords = ["llm", "context-engineering", "compression", "vllm", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40,<2"]
vllm = ["vllm>=0.29.0"]
openai = ["openai>=1.0,<3"]
tokenize = ["tiktoken>=0.5"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "coverage>=7",
    "build>=1",
    "twine>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
all = ["litellm>=1.40,<2", "vllm>=0.29.0", "openai>=1.0,<3", "tiktoken>=0.5"]

[project.scripts]
ceng = "ceng.cli:main"

[project.urls]
Homepage = "https://github.com/sachncs/context"
Issues = "https://github.com/sachncs/context/issues"
Documentation = "https://sachncs.github.io/context"
Changelog = "https://github.com/sachncs/context/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceng = ["py.typed", "bench/fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["ceng"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "D", "N", "ANN", "S", "SIM"]
ignore = [
    "D203", "D213",          # pick google-compatible blank-line rules
    "D102", "D105", "D107",  # overrides inherit the base-class docstring
    "ANN401",                # Any is policed by mypy --strict instead
    "RUF012",
    "B027",                  # optional hooks with no-op defaults are intended
    "S311",                  # random is used for retry jitter, not security
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN", "S311", "N818", "RUF059", "SIM117", "E501"]
"src/ceng/evolution/prompts.py" = ["E501"]  # verbatim upstream prompt text

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/ceng"]

[[tool.mypy.overrides]]
module = ["litellm.*", "openai.*", "vllm.*", "tiktoken.*", "yaml.*"]
ignore_missing_imports = true
