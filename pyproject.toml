[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceng"
version = "0.4.0"
description = "Partition-Prompt-Aggregate context engineering for LLMs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Sachin" }]
keywords = ["llm", "context-engineering", "compression", "vllm", "litellm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.5"]
openai = ["openai>=1.0"]
tokenize = ["tiktoken>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["vllm>=0.5", "openai>=1.0", "tiktoken>=0.5"]

[project.urls]
Homepage = "https://github.com/sachncs/context"
Issues = "https://github.com/sachncs/context/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceng = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["bench", ".ceng"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",  # line length is governed by [tool.ruff] line-length
    "B008",  # default-argument calls in dataclass fields are intentional
    "B905",  # zip() without strict= is fine for our use
    "E741",  # ambiguous variable names like `l` are noise in this codebase
    "RUF012",  # mutable class attributes annotated with ClassVar are noisy
    "RUF022",  # __all__ is grouped by section for readability, not sorted
    "RUF043",  # pytest.raises(match=...) patterns are fine
    "RUF059",  # unpacked-but-unused in tests is intentional
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
