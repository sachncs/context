[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foveate-docx"
version = "0.2.0"
description = "Word (.docx) loader for Foveate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["foveate>=0.2.0", "python-docx>=1"]
keywords = ["llm", "context-engineering", "documents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sachncs/foveate"
Issues = "https://github.com/sachncs/foveate/issues"

[project.entry-points."foveate.loaders"]
docx = "foveate_docx"

[tool.setuptools.packages.find]
include = ["foveate_docx*"]

[tool.setuptools.package-data]
foveate_docx = ["py.typed"]
